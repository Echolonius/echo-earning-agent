name: earning-agent

# Runs on GitHub's servers — alive when the home computer is off.
on:
  schedule:
    - cron: "13 14 * * *"  # once a day at 14:13 UTC; an off-peak minute gets delayed far less (GitHub cron contention)
  workflow_dispatch:          # allow manual runs

# Read-only by default; the job below asks for the one write access it needs.
permissions:
  contents: read

concurrency:
  group: earning-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # so the run can commit status.md / history.jsonl / seen-listings.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Run agent
        env:
          SUPERTEAM_API_KEY: ${{ secrets.SUPERTEAM_API_KEY }}
          DEALWORK_API_KEY: ${{ secrets.DEALWORK_API_KEY }}
          TOKU_API_KEY: ${{ secrets.TOKU_API_KEY }}
          # the job's own token. It can push to this repo (see permissions above); the agent only
          # uses it so the public PR-merge search runs authenticated.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node agent.mjs

      - name: Commit status
        run: |
          # Commit as the GitHub Actions bot, so these automated commits (including the
          # ones made by forks) are never credited to a person's GitHub account.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "status @ $(date -u +%FT%TZ)"
          git push

      # No-signup push notification: agent.mjs writes NOTIFY.txt only on the transition into a real
      # event (a payment landed, a bid accepted, a PR merged). Failing the run here makes GitHub email the
      # repo owner — after the commit above, so state is preserved and the alert fires exactly once.
      - name: Alert owner on win or payment
        if: always()
        run: |
          if [ -f NOTIFY.txt ]; then
            echo "::error title=🏆 EARNING EVENT::$(cat NOTIFY.txt)"
            exit 1
          fi
          echo "no earning event this run"
